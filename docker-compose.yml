services:
  mongo:
     image: mongo:6.0
     container_name: mongo
     restart: unless-stopped
     volumes:
       - mongo-data:/data/db
     networks:
       - mern-net
  backend:
     build:
        context: ./server
        dockerfile: Dockerfile
     container_name: task-app-backend
     restart: unless-stopped
     env_file:
       - ./server/.env.dev
     ports:
       - "5000:5000"
     depends_on:
       - mongo 
     networks:
       - mern-net
  frontend:
     build:
        context: ./client
        dockerfile: Dockerfile
     container_name: task-app-frontend
     restart: unless-stopped
     env_file:
       - ./client/.env.dev
     ports:
       - "5173:5173"
     depends_on:
       - backend 
     networks:
       - mern-net

volumes:
  mongo-data:

networks:
  mern-net:
     driver: bridge